# Engine and watchdog are separate containers on purpose: the watchdog must not
# share a failure domain with the engine (PLAN.md Task 3.3 kill criterion).
services:
  engine:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: ../.env
    volumes:
      - runtime:/app/data
    restart: unless-stopped

  watchdog:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["uv", "run", "python", "-m", "scalpbot.live.watchdog", "--config", "configs/live.yaml"]
    env_file: ../.env
    volumes:
      - runtime:/app/data   # heartbeat file lives here
    restart: unless-stopped

volumes:
  runtime:
